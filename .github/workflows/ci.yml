# Runs every test of both apps on every push and pull request.
# The tests use Testcontainers, which starts a real PostgreSQL in Docker (available on GitHub's runners).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [payflow-api, sample-merchant]
    name: test (${{ matrix.app }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        working-directory: ${{ matrix.app }}
        run: ./mvnw -B verify
