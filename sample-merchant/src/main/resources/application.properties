spring.application.name=sample-merchant
server.port=8081

# Uses the same Postgres as PayFlow (docker-compose.yml) but its own schema, as if it were a separate database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payflow}
spring.datasource.username=${DB_USERNAME:payflow}
spring.datasource.password=${DB_PASSWORD:payflow}
spring.datasource.hikari.schema=sample_merchant
spring.flyway.default-schema=sample_merchant
spring.flyway.create-schemas=true

# The webhook_secret PayFlow gave this shop at registration (starts with whsec_).
shop.payflow.webhook-secret=${PAYFLOW_WEBHOOK_SECRET:}
# Reject webhooks whose timestamp is further than this from now (blocks replays of old webhooks).
shop.payflow.tolerance-seconds=300
