spring.application.name=payflow-api

# Database. Defaults match docker-compose.yml; override with environment variables when deployed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payflow}
spring.datasource.username=${DB_USERNAME:payflow}
spring.datasource.password=${DB_PASSWORD:payflow}

# JSON field names use snake_case (api_key, merchant_id), like most payment APIs.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Flyway runs every file in src/main/resources/db/migration (V1__, V2__, ...) in order on startup.
spring.flyway.locations=classpath:db/migration
