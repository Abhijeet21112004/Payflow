# Local development database.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the named volume)
# Reset:  docker compose down -v     (deletes all data)
services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - payflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  payflow-pgdata:
